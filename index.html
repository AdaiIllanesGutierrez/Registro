
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Lenguaje - 2° Primaria</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F0F4FF;min-height:100vh;color:#1E293B}
.container{max-width:600px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:32px 24px;box-shadow:0 8px 32px rgba(79,70,229,.12)}
.card-sm{background:#fff;border-radius:20px;padding:24px 20px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.center{text-align:center}
.emoji-lg{font-size:48px;margin-bottom:8px}
h1{font-size:24px;font-weight:700;color:#4F46E5;margin:0}
h2{font-size:22px;margin:8px 0 4px}
.sub{color:#64748B;font-size:14px;margin-top:6px}
.sub-sm{color:#64748B;font-size:13px}
.label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.input{width:100%;padding:14px 16px;border-radius:12px;border:2px solid #CBD5E1;font-size:15px;outline:none;transition:border .15s;font-family:inherit}
.input:focus{border-color:#4F46E5}
.input.error{border-color:#DC2626}
.error-msg{color:#DC2626;font-size:12px;margin-top:6px;display:none}
.error-msg.show{display:block}
.btn-primary{width:100%;padding:14px;border-radius:12px;border:none;background:#4F46E5;color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:16px}
.btn-primary:disabled{background:#CBD5E1;cursor:default}
.btn-primary:not(:disabled):hover{background:#3730A3}
.btn-outline{flex:1;padding:13px;border-radius:12px;border:2px solid #CBD5E1;background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.btn-outline:disabled{color:#CBD5E1;cursor:default}
.btn-nav{flex:1;padding:13px;border-radius:12px;border:none;background:#4F46E5;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.btn-nav:hover{background:#3730A3}
.btn-finish{flex:1;padding:13px;border-radius:12px;border:none;background:#F59E0B;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.btn-finish:hover{background:#D97706}

/* Timer */
.timer-bar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #E2E8F0;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;margin:-16px -16px 16px -16px;width:calc(100% + 32px)}
.timer-left{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.timer-icon{font-size:18px}
.timer-time{font-variant-numeric:tabular-nums;min-width:52px}
.timer-time.warn{color:#DC2626;animation:pulse 1s infinite}
.timer-name{font-size:12px;color:#64748B;font-weight:500;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer-progress{height:4px;background:#E0E7FF;border-radius:2px;margin:-2px -16px 16px -16px;width:calc(100% + 32px);overflow:hidden}
.timer-progress-bar{height:100%;background:#4F46E5;border-radius:2px;transition:width 1s linear}
.timer-progress-bar.warn{background:#DC2626}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.progress-wrap{height:6px;background:#E0E7FF;border-radius:3px;margin-bottom:20px;overflow:hidden}
.progress-bar{height:100%;background:#4F46E5;border-radius:3px;transition:width .3s}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-number{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#E0E7FF;color:#4F46E5;font-weight:700;font-size:14px;flex-shrink:0}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.q-text{font-size:16px;font-weight:600;line-height:1.5;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:10px}
.opt-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:2px solid #CBD5E1;background:#fff;font-size:14px;text-align:left;cursor:pointer;transition:all .15s;line-height:1.4;width:100%}
.opt-btn:hover{border-color:#a5b4fc}
.opt-btn.selected{border-color:#4F46E5;background:#E0E7FF}
.opt-letter{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;flex-shrink:0;border:2px solid #CBD5E1;background:#fff;color:#64748B;font-size:12px;font-weight:700}
.opt-btn.selected .opt-letter{border-color:#4F46E5;background:#4F46E5;color:#fff}
.nav-row{display:flex;gap:8px;margin-top:16px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;padding:0 8px}
.dot{width:28px;height:28px;border-radius:50%;border:none;font-size:10px;font-weight:600;cursor:pointer;background:#E2E8F0;color:#64748B}
.dot.current{background:#4F46E5;color:#fff}
.dot.answered{background:#E0E7FF;color:#4F46E5}
.score-box{display:inline-flex;align-items:baseline;gap:4px;padding:16px 32px;border-radius:16px}
.score-box.pass{background:#DCFCE7}
.score-box.fail{background:#FEE2E2}
.score-num{font-size:48px;font-weight:800}
.score-num.pass{color:#16A34A}
.score-num.fail{color:#DC2626}
.score-total{font-size:20px;color:#64748B}
.wrong-item{padding:14px 0}
.wrong-item+.wrong-item{border-top:1px solid #CBD5E1}
.wrong-q{font-size:13px;font-weight:600;margin-bottom:8px}
.wrong-yours{font-size:12px;color:#DC2626;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.wrong-correct{font-size:12px;color:#16A34A;display:flex;align-items:center;gap:6px}
.wrong-none{font-size:12px;color:#64748B;font-style:italic;margin-bottom:4px}
.icon-circle{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:10px;flex-shrink:0}
.icon-wrong{background:#FEE2E2}
.icon-right{background:#DCFCE7}
.results-actions{display:flex;gap:8px;margin-top:24px}
.full-center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.mb8{margin-bottom:8px}
.mb16{margin-bottom:16px}
.mb20{margin-bottom:20px}
.mb24{margin-bottom:24px}
.mt8{margin-top:8px}
.timeout-badge{display:inline-block;background:#FEF3C7;color:#92400E;font-size:12px;font-weight:600;padding:4px 12px;border-radius:8px;margin-top:8px}
.student-name{font-size:14px;color:#4F46E5;font-weight:600}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ══════════ QUESTIONS ══════════ */
const QUESTIONS_RAW = [
  ["¿En cuál de las siguientes opciones TODAS las letras son vocales?", ["a, e, p, u", "e, i, o, u", "a, o, m, e"], 1],
  ["Si dividimos correctamente en sílabas la palabra \"mariposa\" (ma-ri-po-sa), ¿cuántas sílabas tiene?", ["3 sílabas", "4 sílabas", "5 sílabas"], 1],
  ["Identifica la vocal con la que inicia la palabra \"Avión\" y la letra final de la palabra \"Helado\":", ["Inicia con A, termina con O", "Inicia con E, termina con A", "Inicia con I, termina con O"], 0],
  ["¿Cuál de las siguientes sílabas falta para completar la palabra del animal saltarín: \"Ra - ____ - na\"?", ["ta", "to", "te"], 0],
  ["¿Qué sonido exacto se forma al unir la consonante \"m\" con las vocales \"o\" y \"a\" en ese orden?", ["mo - ma", "me - mo", "ma - mo"], 0],
  ["¿Cuántas letras en total tiene la palabra \"sol\" y cuántas vocales contiene?", ["3 letras y 2 vocales", "3 letras y 1 vocal", "4 letras y 1 vocal"], 1],
  ["Selecciona la opción que contiene únicamente palabras de 3 sílabas (trisílabas):", ["sol, perro, pan", "caracol, estrella, camisa", "mariposa, helicóptero, luz"], 1],
  ["Marca la palabra que comience con la consonante \"s\" y termine con la vocal \"a\":", ["Sombrero", "Sopa", "Sol"], 1],
  ["¿Cuál es el artículo determinado que corresponde a la palabra \"manzana\"?", ["El manzana", "La manzana", "Los manzana"], 1],
  ["De acuerdo con la regla de uso de mayúsculas en nombres propios, ¿cómo debe escribirse el nombre de una persona?", ["juan (todo minúscula)", "JUAN (todo mayúscula)", "Juan (primera letra mayúscula)"], 2],
  ["¿Cuál es la regla correcta para formar el plural de las palabras que terminan en \"z\", como \"lápiz\"?", ["Se cambia la Z por C y se agrega \"es\" (lápices)", "Se mantiene la Z y se agrega \"s\" (lápizs)", "Se escribe con Z y \"es\" (lápizes)"], 0],
  ["La letra \"H\" es muda en español. Identifica la palabra redactada correctamente con \"H\":", ["elado", "helado", "eladoh"], 1],
  ["Observa la frase: \"¿Cuál es tu animal favorito?\". ¿Qué signos se usan para realizar preguntas?", ["Signos de admiración ( ¡ ! )", "Signos de interrogación ( ¿ ? )", "Punto y coma ( ; )"], 1],
  ["Distingue la palabra que está escrita con la ortografía correcta:", ["Vaca (con V)", "Baka (con B y K)", "Vaka (con V y K)"], 0],
  ["¿Qué signo ortográfico es obligatorio colocar al finalizar toda oración?", ["Una coma ( , )", "Un punto ( . )", "Un guión ( - )"], 1],
  ["¿Por qué se dice que la letra \"H\" es una letra especial en el idioma español?", ["Porque suena como la letra S", "Porque es una letra muda (no tiene sonido propio)", "Porque siempre se escribe al final de las palabras"], 1],
  ["Dos palabras riman cuando terminan con el mismo sonido. ¿Cuál rima con \"gato\"?", ["Pato", "Perro", "Ratón"], 0],
  ["Lee la oración: \"El perro corre en el parque\". ¿Quién es el sujeto que realiza la acción de correr?", ["corre", "el parque", "El perro"], 2],
  ["Los antónimos son palabras con significados opuestos. ¿Cuál es el antónimo de la palabra \"día\"?", ["Sol", "Noche", "Luz"], 1],
  ["¿Cuál es la forma en femenino de la palabra \"león\"?", ["Leona", "Leoncita", "Leonera"], 0],
  ["Una sílaba trabada se compone de dos consonantes seguidas de una vocal. Encuentra la palabra con sílaba trabada:", ["Flor (fl)", "Mesa (m)", "Cama (c)"], 0],
  ["Los sinónimos son palabras que significan lo mismo. ¿Cuál es el sinónimo de la palabra \"pequeño\"?", ["Grande", "Chico", "Alto"], 1],
  ["Si completas \"_ato\" con la consonante \"g\", obtienes \"gato\". ¿Qué animal se forma si la completas con \"p\"?", ["Rato", "Pato", "Mato"], 1],
  ["Clasificación semántica: ¿Cuál de las siguientes palabras corresponde a la categoría de un COLOR?", ["Dulce", "Rojo", "Salado"], 1],
  ["Encuentra la pareja de palabras que tienen rima consonante perfecta al terminar en \"-ón\":", ["Camión y Avión", "Camión y Casa", "Camión y Flor"], 0]
];

const TOTAL_TIME = 10 * 60; // 10 minutes in seconds

/* ══════════ STATE ══════════ */
let state = {
  screen: "name", // name → password → quiz → results
  studentName: "",
  questions: [],
  current: 0,
  answers: {},
  submitted: false,
  timeLeft: TOTAL_TIME,
  timedOut: false
};
let timerInterval = null;

/* ══════════ HELPERS ══════════ */
function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuestions(raw) {
  return shuffle(raw).map(([q, opts, correct]) => {
    const correctText = opts[correct];
    const shuffled = shuffle(opts.map((o) => ({ text: o })));
    return {
      question: q,
      options: shuffled.map(s => s.text),
      correctIndex: shuffled.findIndex(s => s.text === correctText)
    };
  });
}

function letter(i) { return String.fromCharCode(65 + i); }

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ":" + (sec < 10 ? "0" : "") + sec;
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    state.timeLeft--;
    updateTimerDisplay();
    if (state.timeLeft <= 0) {
      clearInterval(timerInterval);
      state.timedOut = true;
      state.submitted = true;
      render();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById("timer-time");
  const bar = document.getElementById("timer-bar-fill");
  if (el) {
    el.textContent = formatTime(state.timeLeft);
    const warn = state.timeLeft <= 60;
    el.className = "timer-time" + (warn ? " warn" : "");
    if (bar) {
      const pct = (state.timeLeft / TOTAL_TIME) * 100;
      bar.style.width = pct + "%";
      bar.className = "timer-progress-bar" + (warn ? " warn" : "");
    }
  }
}

function stopTimer() { clearInterval(timerInterval); }

function render() {
  const app = document.getElementById("app");
  if (state.screen === "name") app.innerHTML = renderName();
  else if (state.screen === "password") app.innerHTML = renderPassword();
  else if (state.submitted) { stopTimer(); app.innerHTML = renderResults(); }
  else app.innerHTML = renderQuiz();
  bindEvents();
}

/* ══════════ NAME SCREEN ══════════ */
function renderName() {
  return `<div class="full-center"><div class="card" style="max-width:420px;width:100%">
    <div class="center mb24">
      <div class="emoji-lg">📝</div>
      <h1>Examen de Lenguaje</h1>
      <p class="sub">2° de Primaria</p>
    </div>
    <div class="label">¿Cómo te llamas?</div>
    <input class="input" id="nameInput" type="text" placeholder="Escribe tu nombre completo" autocomplete="off" autofocus>
    <button class="btn-primary" id="btnName" disabled>Continuar</button>
  </div></div>`;
}

/* ══════════ PASSWORD SCREEN ══════════ */
function renderPassword() {
  return `<div class="full-center"><div class="card" style="max-width:420px;width:100%">
    <div class="center mb24">
      <div class="emoji-lg">🔒</div>
      <h1>Contraseña</h1>
      <p class="sub">Ingresa la contraseña para comenzar el examen</p>
    </div>
    <div class="student-name center mb16">👋 Hola, ${state.studentName}</div>
    <div class="label">Contraseña</div>
    <input class="input" id="passInput" type="password" placeholder="Ingresa la contraseña" autocomplete="off" autofocus>
    <div class="error-msg" id="passError">Contraseña incorrecta. Intenta de nuevo.</div>
    <button class="btn-primary" id="btnPass">Ingresar</button>
  </div></div>`;
}

/* ══════════ QUIZ SCREEN ══════════ */
function renderQuiz() {
  const q = state.questions[state.current];
  const total = state.questions.length;
  const answered = Object.keys(state.answers).length;
  const pct = ((state.current + 1) / total) * 100;
  const isLast = state.current >= total - 1;
  const warn = state.timeLeft <= 60;

  return `<div class="container">
    <div class="timer-bar">
      <div class="timer-left">
        <span class="timer-icon">⏱️</span>
        <span id="timer-time" class="timer-time${warn ? " warn" : ""}">${formatTime(state.timeLeft)}</span>
      </div>
      <span class="timer-name">${state.studentName}</span>
    </div>
    <div class="timer-progress"><div id="timer-bar-fill" class="timer-progress-bar${warn ? " warn" : ""}" style="width:${(state.timeLeft / TOTAL_TIME) * 100}%"></div></div>

    <div class="header-row">
      <span style="font-size:13px;font-weight:600;color:#4F46E5">Lenguaje · 2° Primaria</span>
      <span class="sub-sm">${answered}/${total} respondidas</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>

    <div class="card mb16">
      <div class="q-header"><span class="q-number">${state.current + 1}</span><span class="sub-sm">de ${total}</span></div>
      <p class="q-text">${q.question}</p>
      <div class="options">${q.options.map((o, i) => {
        const sel = state.answers[state.current] === i;
        return `<button class="opt-btn${sel ? " selected" : ""}" data-action="answer" data-val="${i}"><span class="opt-letter">${letter(i)}</span>${o}</button>`;
      }).join("")}</div>
    </div>

    <div class="nav-row">
      <button class="btn-outline" ${state.current === 0 ? "disabled" : ""} data-action="prev">← Anterior</button>
      ${isLast
        ? `<button class="btn-finish" data-action="finish">Finalizar ✓</button>`
        : `<button class="btn-nav" data-action="next">Siguiente →</button>`}
    </div>

    <div class="dots">${state.questions.map((_, i) => {
      let cls = "dot";
      if (i === state.current) cls += " current";
      else if (state.answers[i] !== undefined) cls += " answered";
      return `<button class="${cls}" data-action="goto" data-val="${i}">${i + 1}</button>`;
    }).join("")}</div>
  </div>`;
}

/* ══════════ RESULTS SCREEN ══════════ */
function renderResults() {
  const total = state.questions.length;
  const score = state.questions.reduce((s, q, i) => s + (state.answers[i] === q.correctIndex ? 1 : 0), 0);
  const pct = Math.round((score / total) * 100);
  const pass = pct >= 60;
  const emoji = pct >= 80 ? "🏆" : pct >= 60 ? "👍" : pct >= 40 ? "💪" : "📚";
  const answered = Object.keys(state.answers).length;

  const wrong = state.questions
    .map((q, i) => ({ ...q, idx: i, userAns: state.answers[i] }))
    .filter(q => q.userAns !== q.correctIndex);

  let timeoutBadge = "";
  if (state.timedOut) {
    timeoutBadge = `<div class="timeout-badge">⏱️ Tiempo agotado · ${answered}/${total} respondidas</div>`;
  }

  let wrongHTML = "";
  if (wrong.length) {
    wrongHTML = `<div class="card-sm" style="margin-top:20px">
      <h3 style="font-size:16px;color:#DC2626;margin:0 0 16px;display:flex;align-items:center;gap:8px"><span>✗</span> Preguntas incorrectas (${wrong.length})</h3>
      ${wrong.map((w, i) => {
        const yours = w.userAns !== undefined
          ? `<div class="wrong-yours"><span class="icon-circle icon-wrong">✗</span>Tu respuesta: ${w.options[w.userAns]}</div>`
          : `<div class="wrong-none">Sin respuesta</div>`;
        return `<div class="wrong-item">
          <p class="wrong-q">${w.question}</p>
          ${yours}
          <div class="wrong-correct"><span class="icon-circle icon-right">✓</span>Respuesta correcta: ${w.options[w.correctIndex]}</div>
        </div>`;
      }).join("")}
    </div>`;
  }

  return `<div class="container">
    <div class="card center">
      <div style="font-size:56px">${emoji}</div>
      <h2>Resultados</h2>
      <div class="student-name mb8">${state.studentName}</div>
      <p class="sub-sm mb20">Lenguaje · 2° de Primaria</p>
      ${timeoutBadge}
      <div class="score-box ${pass ? "pass" : "fail"}" style="margin-top:16px">
        <span class="score-num ${pass ? "pass" : "fail"}">${score}</span>
        <span class="score-total">/ ${total}</span>
      </div>
      <p class="sub-sm mt8">${pct}% de aciertos</p>
      <div class="results-actions">
        <button class="btn-outline" style="flex:1" data-action="retry">Reintentar</button>
        <button class="btn-nav" style="flex:1" data-action="home">Inicio</button>
      </div>
    </div>
    ${wrongHTML}
  </div>`;
}

/* ══════════ EVENT BINDING ══════════ */
function bindEvents() {
  // Name screen
  const nameInput = document.getElementById("nameInput");
  const btnName = document.getElementById("btnName");
  if (nameInput && btnName) {
    nameInput.addEventListener("input", () => {
      btnName.disabled = nameInput.value.trim().length === 0;
    });
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && nameInput.value.trim()) {
        state.studentName = nameInput.value.trim();
        state.screen = "password";
        render();
      }
    });
    btnName.addEventListener("click", () => {
      state.studentName = nameInput.value.trim();
      state.screen = "password";
      render();
    });
    nameInput.focus();
  }

  // Password screen
  const passInput = document.getElementById("passInput");
  const btnPass = document.getElementById("btnPass");
  const passError = document.getElementById("passError");
  if (passInput && btnPass) {
    const tryPassword = () => {
      if (passInput.value === "1234") {
        state.screen = "quiz";
        state.questions = prepareQuestions(QUESTIONS_RAW);
        state.answers = {};
        state.current = 0;
        state.submitted = false;
        state.timedOut = false;
        state.timeLeft = TOTAL_TIME;
        render();
        startTimer();
      } else {
        passInput.classList.add("error");
        if (passError) passError.classList.add("show");
        passInput.value = "";
        passInput.focus();
      }
    };
    passInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryPassword();
      else { passInput.classList.remove("error"); if (passError) passError.classList.remove("show"); }
    });
    btnPass.addEventListener("click", tryPassword);
    passInput.focus();
  }

  // Quiz & results actions
  document.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", () => {
      const action = el.dataset.action;
      const val = el.dataset.val;
      switch (action) {
        case "answer": state.answers = { ...state.answers, [state.current]: parseInt(val) }; break;
        case "prev": state.current = Math.max(0, state.current - 1); break;
        case "next": state.current = Math.min(state.questions.length - 1, state.current + 1); break;
        case "goto": state.current = parseInt(val); break;
        case "finish": stopTimer(); state.submitted = true; break;
        case "retry":
          state.questions = prepareQuestions(QUESTIONS_RAW);
          state.answers = {}; state.current = 0; state.submitted = false;
          state.timedOut = false; state.timeLeft = TOTAL_TIME;
          render(); startTimer(); return;
        case "home":
          stopTimer();
          state = { screen: "name", studentName: "", questions: [], current: 0, answers: {}, submitted: false, timeLeft: TOTAL_TIME, timedOut: false };
          break;
      }
      render();
      if (action === "finish" || action === "home") window.scrollTo(0, 0);
    });
  });
}

render();
</script>
</body>
</html>
