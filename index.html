<html lang="es">

<title>Olimpiadas Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F0F4FF;min-height:100vh;color:#1E293B}
.container{max-width:600px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:32px 24px;box-shadow:0 8px 32px rgba(79,70,229,.12)}
.card-sm{background:#fff;border-radius:20px;padding:24px 20px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.center{text-align:center}
.emoji{font-size:48px;margin-bottom:8px}
h1{font-size:26px;font-weight:700;color:#4F46E5;margin:0}
h2{font-size:22px;margin:8px 0 4px}
h3{font-size:16px;margin:0 0 16px;display:flex;align-items:center;gap:8px}
.sub{color:#64748B;font-size:14px;margin-top:6px}
.sub-sm{color:#64748B;font-size:13px}
.label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.btn-row{display:flex;gap:8px;margin-bottom:20px}
.btn-row.col{flex-direction:column}
.btn{padding:12px 16px;border-radius:12px;border:2px solid #CBD5E1;background:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;text-align:left;width:100%}
.btn:hover{border-color:#a5b4fc}
.btn.active{border-color:#4F46E5;background:#E0E7FF;color:#3730A3}
.btn-primary{width:100%;padding:14px;border-radius:12px;border:none;background:#4F46E5;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.btn-primary:disabled{background:#CBD5E1;cursor:default}
.btn-primary:not(:disabled):hover{background:#3730A3}
.btn-outline{flex:1;padding:13px;border-radius:12px;border:2px solid #CBD5E1;background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.btn-outline:hover{border-color:#a5b4fc}
.btn-outline:disabled{color:#CBD5E1;cursor:default}
.btn-nav{flex:1;padding:13px;border-radius:12px;border:none;background:#4F46E5;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.btn-nav:hover{background:#3730A3}
.btn-finish{flex:1;padding:13px;border-radius:12px;border:none;background:#F59E0B;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.btn-finish:hover{background:#D97706}
.subject-count{display:block;font-size:11px;font-weight:400;color:#64748B;margin-top:2px}
.progress-wrap{height:6px;background:#E0E7FF;border-radius:3px;margin-bottom:20px;overflow:hidden}
.progress-bar{height:100%;background:#4F46E5;border-radius:3px;transition:width .3s}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-number{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#E0E7FF;color:#4F46E5;font-weight:700;font-size:14px;flex-shrink:0}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.q-text{font-size:16px;font-weight:600;line-height:1.5;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:10px}
.opt-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:2px solid #CBD5E1;background:#fff;font-size:14px;text-align:left;cursor:pointer;transition:all .15s;line-height:1.4;width:100%}
.opt-btn:hover{border-color:#a5b4fc}
.opt-btn.selected{border-color:#4F46E5;background:#E0E7FF}
.opt-letter{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;flex-shrink:0;border:2px solid #CBD5E1;background:#fff;color:#64748B;font-size:12px;font-weight:700}
.opt-btn.selected .opt-letter{border-color:#4F46E5;background:#4F46E5;color:#fff}
.nav-row{display:flex;gap:8px;margin-top:16px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;padding:0 8px}
.dot{width:28px;height:28px;border-radius:50%;border:none;font-size:10px;font-weight:600;cursor:pointer;background:#E2E8F0;color:#64748B}
.dot.current{background:#4F46E5;color:#fff}
.dot.answered{background:#E0E7FF;color:#4F46E5}
.score-box{display:inline-flex;align-items:baseline;gap:4px;padding:16px 32px;border-radius:16px}
.score-box.pass{background:#DCFCE7}
.score-box.fail{background:#FEE2E2}
.score-num{font-size:48px;font-weight:800}
.score-num.pass{color:#16A34A}
.score-num.fail{color:#DC2626}
.score-total{font-size:20px;color:#64748B}
.wrong-item{padding:14px 0}
.wrong-item+.wrong-item{border-top:1px solid #CBD5E1}
.wrong-q{font-size:13px;font-weight:600;margin-bottom:8px}
.wrong-yours{font-size:12px;color:#DC2626;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.wrong-correct{font-size:12px;color:#16A34A;display:flex;align-items:center;gap:6px}
.wrong-none{font-size:12px;color:#64748B;font-style:italic;margin-bottom:4px}
.icon-circle{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:10px;line-height:16px;text-align:center;flex-shrink:0}
.icon-wrong{background:#FEE2E2}
.icon-right{background:#DCFCE7}
.results-actions{display:flex;gap:8px;margin-top:24px}
.full-center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.mb20{margin-bottom:20px}
.mb24{margin-bottom:24px}
.mb16{margin-bottom:16px}
.mt8{margin-top:8px}
</style>
</head>

      ["¿Cuál es el verbo en la siguiente oración: \"Los niños corren en el recreo\"?", ["niños", "recreo", "corren", "Los"], 2],
      ["¿Qué es un comunicado?", ["Un poema artístico", "Un informe que comunica información para conocimiento público", "Una carta personal", "Un cuento de hadas"], 1],
      ["¿Cuál es la diferencia entre publicidad y propaganda?", ["Son exactamente lo mismo", "La publicidad busca vender un producto, la propaganda busca influir en la actitud de la comunidad", "La publicidad es oral y la propaganda es escrita", "No existe diferencia alguna"], 1],
      ["¿Qué es un debate?", ["Una pelea entre personas", "Una discusión planificada y argumentativa", "Un monólogo individual", "Un tipo de cuento"], 1],
      ["¿Quiénes participan en un debate?", ["Solo el público", "El moderador y los participantes", "Solo una persona", "El escritor y el lector"], 1],
      ["¿Qué es el método Cornell?", ["Un tipo de examen", "Una técnica para tomar apuntes", "Un deporte", "Una forma de dibujar"], 1],
      ["¿Para qué sirve el mapa conceptual?", ["Para dibujar paisajes", "Para comprender un tema usando información visual y organizada", "Para escribir cartas", "Para hacer cálculos matemáticos"], 1],
      ["¿Cuáles son las partes reconocidas de una carta?", ["Solo saludo y despedida", "Fecha, destinatario, cargo, lugar, referencia, saludo, desarrollo, despedida y firma", "Solo el mensaje", "Título y autor"], 1],
      ["¿Cuándo se escribe con mayúscula?", ["Solo al inicio de un texto", "La primera letra de un escrito, después de punto, nombres propios y al iniciar citas textuales", "Nunca se usa mayúscula", "Solo en nombres de ciudades"], 1],
      ["¿Cuáles son las partes de una receta de cocina?", ["Solo los ingredientes", "Nombre del plato, tiempo de preparación, ingredientes e instrucciones", "Solo el nombre del plato", "Título y firma del chef"], 1]
    ]
  }
};

const COURSES = [
  { id: "2-primaria", label: "2° de Primaria" },
  { id: "4-primaria", label: "4° de Primaria" }
];

/* ══════════ STATE ══════════ */
let state = { screen: "start", courseId: "", subject: "", questions: [], current: 0, answers: {}, submitted: false };

/* ══════════ HELPERS ══════════ */
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function prepareQuestions(raw) {
  return shuffle(raw).map(([q, opts, correct]) => {
    const correctText = opts[correct];
    const shuffled = shuffle(opts.map((o, i) => ({ text: o, orig: i })));
    return { question: q, options: shuffled.map(s => s.text), correctIndex: shuffled.findIndex(s => s.text === correctText) };
  });
}

function letter(i) { return String.fromCharCode(65 + i); }

function render() {
  const app = document.getElementById("app");
  if (state.screen === "start") app.innerHTML = renderStart();
  else if (state.submitted) app.innerHTML = renderResults();
  else app.innerHTML = renderQuiz();
  bindEvents();
}

/* ══════════ START SCREEN ══════════ */
function renderStart() {
  const subjects = state.courseId ? Object.keys(EXAMS[state.courseId] || {}) : [];
  const canStart = state.courseId && state.subject;
  let subjectHTML = "";
  if (subjects.length) {
    subjectHTML = `<div class="label">Materia</div><div class="btn-row col mb24">` +
      subjects.map(s => {
        const icon = s === "Ciencias Sociales" ? "🌍" : "📖";
        const count = EXAMS[state.courseId][s].length;
        return `<button class="btn${state.subject === s ? " active" : ""}" data-action="subject" data-val="${s}">${icon} ${s}<span class="subject-count">${count} preguntas</span></button>`;
      }).join("") + `</div>`;
  }
  return `<div class="full-center"><div class="card" style="max-width:440px;width:100%">
    <div class="center mb24"><div class="emoji">📝</div><h1>Olimpiadas Quiz</h1><p class="sub">Selecciona tu curso y materia para comenzar</p></div>
    <div class="label">Curso</div>
    <div class="btn-row mb20">${COURSES.map(c => `<button class="btn${state.courseId === c.id ? " active" : ""}" style="flex:1;text-align:center" data-action="course" data-val="${c.id}">${c.label}</button>`).join("")}</div>
    ${subjectHTML}
    <button class="btn-primary" ${canStart ? "" : "disabled"} data-action="start">Comenzar examen</button>
  </div></div>`;
}

/* ══════════ QUIZ SCREEN ══════════ */
function renderQuiz() {
  const q = state.questions[state.current];
  const total = state.questions.length;
  const answered = Object.keys(state.answers).length;
  const pct = ((state.current + 1) / total) * 100;
  const isLast = state.current >= total - 1;

  return `<div class="container">
    <div class="header-row">
      <span style="font-size:13px;font-weight:600;color:#4F46E5">${state.subject}</span>
      <span class="sub-sm">${answered}/${total} respondidas</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="card mb16">
      <div class="q-header"><span class="q-number">${state.current + 1}</span><span class="sub-sm">de ${total}</span></div>
      <p class="q-text">${q.question}</p>
      <div class="options">${q.options.map((o, i) => {
        const sel = state.answers[state.current] === i;
        return `<button class="opt-btn${sel ? " selected" : ""}" data-action="answer" data-val="${i}"><span class="opt-letter">${letter(i)}</span>${o}</button>`;
      }).join("")}</div>
    </div>
    <div class="nav-row">
      <button class="btn-outline" ${state.current === 0 ? "disabled" : ""} data-action="prev">← Anterior</button>
      ${isLast
        ? `<button class="btn-finish" data-action="finish">Finalizar ✓</button>`
        : `<button class="btn-nav" data-action="next">Siguiente →</button>`}
    </div>
    <div class="dots">${state.questions.map((_, i) => {
      let cls = "dot";
      if (i === state.current) cls += " current";
      else if (state.answers[i] !== undefined) cls += " answered";
      return `<button class="${cls}" data-action="goto" data-val="${i}">${i + 1}</button>`;
    }).join("")}</div>
  </div>`;
}

/* ══════════ RESULTS SCREEN ══════════ */
function renderResults() {
  const total = state.questions.length;
  const score = state.questions.reduce((s, q, i) => s + (state.answers[i] === q.correctIndex ? 1 : 0), 0);
  const pct = Math.round((score / total) * 100);
  const pass = pct >= 60;
  const emoji = pct >= 80 ? "🏆" : pct >= 60 ? "👍" : pct >= 40 ? "💪" : "📚";

  const wrong = state.questions
    .map((q, i) => ({ ...q, idx: i, userAns: state.answers[i] }))
    .filter(q => q.userAns !== q.correctIndex);

  let wrongHTML = "";
  if (wrong.length) {
    wrongHTML = `<div class="card-sm" style="margin-top:20px">
      <h3 style="color:#DC2626"><span>✗</span> Preguntas incorrectas (${wrong.length})</h3>
      ${wrong.map((w, i) => {
        const yours = w.userAns !== undefined
          ? `<div class="wrong-yours"><span class="icon-circle icon-wrong">✗</span>Tu respuesta: ${w.options[w.userAns]}</div>`
          : `<div class="wrong-none">Sin respuesta</div>`;
        return `<div class="wrong-item">
          <p class="wrong-q">${w.question}</p>
          ${yours}
          <div class="wrong-correct"><span class="icon-circle icon-right">✓</span>Respuesta correcta: ${w.options[w.correctIndex]}</div>
        </div>`;
      }).join("")}
    </div>`;
  }

  return `<div class="container">
    <div class="card center">
      <div style="font-size:56px">${emoji}</div>
      <h2>Resultados del examen</h2>
      <p class="sub-sm" style="margin-bottom:20px">${state.subject}</p>
      <div class="score-box ${pass ? "pass" : "fail"}">
        <span class="score-num ${pass ? "pass" : "fail"}">${score}</span>
        <span class="score-total">/ ${total}</span>
      </div>
      <p class="sub-sm mt8">${pct}% de aciertos</p>
      <div class="results-actions">
        <button class="btn-outline" style="flex:1" data-action="retry">Reintentar</button>
        <button class="btn-nav" style="flex:1" data-action="home">Inicio</button>
      </div>
    </div>
    ${wrongHTML}
  </div>`;
}

/* ══════════ EVENT BINDING ══════════ */
function bindEvents() {
  document.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", () => {
      const action = el.dataset.action;
      const val = el.dataset.val;
      switch (action) {
        case "course": state.courseId = val; state.subject = ""; break;
        case "subject": state.subject = val; break;
        case "start":
          if (state.courseId && state.subject) {
            state.questions = prepareQuestions(EXAMS[state.courseId][state.subject]);
            state.answers = {}; state.current = 0; state.submitted = false; state.screen = "quiz";
          } break;
        case "answer": state.answers = { ...state.answers, [state.current]: parseInt(val) }; break;
        case "prev": state.current = Math.max(0, state.current - 1); break;
        case "next": state.current = Math.min(state.questions.length - 1, state.current + 1); break;
        case "goto": state.current = parseInt(val); break;
        case "finish": state.submitted = true; break;
        case "retry":
          state.questions = prepareQuestions(EXAMS[state.courseId][state.subject]);
          state.answers = {}; state.current = 0; state.submitted = false; break;
        case "home":
          state = { screen: "start", courseId: "", subject: "", questions: [], current: 0, answers: {}, submitted: false }; break;
      }
      render();
      window.scrollTo(0, 0);
    });
  });
}

render();
</script>
</body>
</html>
